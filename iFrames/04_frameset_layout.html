<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>
<!-- Frameset is a legacy HTML feature used to divide a browser window into frames. -->
<frameset rows="30%,70%">
    <!-- Top frame contains navigation links -->
    <frame src="04_navigation.html" title="Navigation Frame">

    <!-- Bottom frame displays the welcome message -->
    <frame src="04_welcome.html" title="Welcome Frame">
</frameset>
</html>
