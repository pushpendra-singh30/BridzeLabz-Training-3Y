<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>
    <h1>File Upload Form</h1>

    <!-- accept restricts the file picker to JPG and PNG image types. -->
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="photo">Choose an image:</label>
        <input type="file" id="photo" name="photo" accept=".jpg,.png,image/jpeg,image/png">
        <br><br>
        <button type="submit">Upload</button>
    </form>

    <p>Allowed files: JPG and PNG image files only.</p>
</body>
</html>
