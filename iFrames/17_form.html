<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <h1>Simple Form</h1>

    <!-- Form target is the iframe below, so result.html loads there after Submit. -->
    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required>
        <button type="submit">Submit</button>
    </form>

    <br>

    <!-- Result page will be displayed in this iframe after submission. -->
    <iframe
        name="resultFrame"
        src="about:blank"
        width="600"
        height="150"
        title="Form Result">
    </iframe>
</body>
</html>
