<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding used by the page -->
    <meta charset="UTF-8">
    <!-- Author information -->
    <meta name="author" content="Pushpendra Singh">
    <!-- Makes the page responsive to browser/device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTF-8 Encoding Test</title>
</head>
<body>
    <!-- Text in three languages verifies UTF-8 character rendering -->
    <p>English: Welcome to my webpage.</p>
    <p>Hindi: मेरी वेबसाइट पर आपका स्वागत है।</p>
    <p>Japanese: 私のウェブページへようこそ。</p>
</body>
</html>
