<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>

    <!-- The space is encoded as %20 and the ampersand is encoded as %26. -->
    <p>Original example: https://example.com/search?query=HTML &amp; CSS</p>

    <p>
        Correct encoded URL:
        <a href="https://example.com/search?query=HTML%20%26%20CSS">
            Search for HTML &amp; CSS
        </a>
    </p>
</body>
</html>
