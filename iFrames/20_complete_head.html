<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta charset defines the character encoding of the document. -->
    <meta charset="UTF-8">

    <!-- meta description provides a short description for search engines. -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- meta author identifies the author of the page. -->
    <meta name="author" content="Pushpendra Singh">

    <!-- base sets the base URL used for relative links. -->
    <base href="https://example.com/">

    <!-- link can connect external resources such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- style contains CSS rules; it is intentionally empty for this HTML-only task. -->
    <style>
    </style>

    <!-- script is normally used for JavaScript; it is intentionally empty here. -->
    <script>
    </script>

    <!-- title defines the browser tab title. -->
    <title>Complete HTML Head Elements</title>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates title, meta, base, link, style, and script elements.</p>
</body>
</html>
