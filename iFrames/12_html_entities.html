<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>
    <!-- HTML entities are used to display reserved characters and symbols. -->
    <p>
        Less than: &lt;
        Greater than: &gt;
        Ampersand: &amp;
        Double quote: &quot;
        Single quote: &apos;
    </p>

    <p>
        Copyright: &copy;
        Trademark: &trade;
        Registered: &reg;
    </p>
</body>
</html>
