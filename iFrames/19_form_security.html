<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security Attributes</title>
</head>
<body>
    <h1>Secure Form Example</h1>

    <!-- autocomplete="off" prevents the browser from automatically filling form data. -->
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p>
        Turning off autocomplete can reduce the chance that sensitive form data
        is automatically stored or suggested by the browser on shared computers.
    </p>
</body>
</html>
