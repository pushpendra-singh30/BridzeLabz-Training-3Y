<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>
    <h1>Long and Short Quotations</h1>

    <!-- Long quotation uses blockquote. -->
    <blockquote>
        Learning HTML teaches us how web pages are structured, and understanding
        its elements helps us build meaningful and accessible documents.
        HTML &amp; CSS are different technologies with different purposes.
    </blockquote>

    <!-- Short quotation uses q inside a paragraph. -->
    <p>My teacher often says, <q>Practice makes progress.</q></p>
</body>
</html>
