<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Borders and Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Borders & Padding Demonstration</h1></header>
    <main class="boxes">
        <section class="box solid"><h2>Solid Border</h2><p>Padding: 10px</p></section>
        <section class="box dashed"><h2>Dashed Border</h2><p>Padding: 20px</p></section>
        <section class="box double"><h2>Double Border</h2><p>Padding: 30px</p></section>
        <section class="box groove"><h2>Groove Border</h2><p>Padding: 40px</p></section>
        <section class="box rounded"><h2>Rounded Corners</h2><p>border-radius: 25px</p></section>
    </main>
    <footer><p>Hover over a box to see the border color change.</p></footer>
</body>
</html>
