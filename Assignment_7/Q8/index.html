<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>CSS Box Model Exploration</h1>
        <section class="demo-area">
            <div class="margin-layer">
                <span class="layer-label margin-label">Margin</span>
                <div class="border-layer">
                    <span class="layer-label border-label">Border</span>
                    <div class="padding-layer">
                        <span class="layer-label padding-label">Padding</span>
                        <div class="content-layer">
                            <span>Content</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="comparison">
            <article>
                <h2>Default Box Sizing</h2>
                <div class="default-box">Width: 250px + padding + border</div>
                <p>With content-box, padding and border are added to the declared width.</p>
            </article>
            <article>
                <h2>Border Box</h2>
                <div class="border-box">Total Width: 250px</div>
                <p>With border-box, padding and border are included in the declared width.</p>
            </article>
        </section>
    </main>
</body>
</html>
