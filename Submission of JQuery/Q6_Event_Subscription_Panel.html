<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q6 - Event Subscription</title><style>
body{font-family:Arial;margin:25px}.panel{max-width:650px;padding:20px;border:1px solid #ddd;border-radius:10px}.topic{padding:10px;margin:6px;background:#f2f5f8}.message{color:green;font-weight:bold}
</style><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="Q6_Event_Subscription_Panel.js"></script>
</head><body><main class="panel"><h1>Event Subscription Panel</h1>
<p>Status: <strong id="status">Unsubscribed</strong></p>
<button id="subscribe">Subscribe</button><button id="unsubscribe">Unsubscribe</button>
<section><h2>Topics</h2><div id="topics">
<div class="topic">Technology <button class="remove">Remove</button></div>
<div class="topic">Sports <button class="remove">Remove</button></div>
<div class="topic">Education <button class="remove">Remove</button></div>
<div class="topic">Business <button class="remove">Remove</button></div>
<div class="topic">Entertainment <button class="remove">Remove</button></div>
</div><label>New topic <input id="newTopic" type="text"></label><button id="addTopic">Add Topic</button></section>
<p id="message" class="message" aria-live="polite"></p></main></body></html>
