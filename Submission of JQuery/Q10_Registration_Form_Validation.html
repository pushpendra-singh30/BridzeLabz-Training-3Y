<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q10 - Registration Form Validation</title><style>
body{font-family:Arial;margin:30px;background:#f6f8fb}.form-card{max-width:500px;margin:auto;background:#fff;padding:24px;border-radius:12px}
label{display:block;margin-top:12px}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #aaa;border-radius:5px}
button{margin-top:18px;padding:10px 16px}.success{color:green}.error{color:#b00020}
</style><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="Q10_Registration_Form_Validation.js"></script>
</head><body><main class="form-card"><h1>Register</h1>
<form id="registrationForm" novalidate>
<label for="name">Name</label><input id="name" name="name" type="text">
<label for="email">Email</label><input id="email" name="email" type="email">
<label for="password">Password</label><input id="password" name="password" type="password">
<button type="submit">Create Account</button>
</form><p id="message" aria-live="polite"></p></main></body></html>
