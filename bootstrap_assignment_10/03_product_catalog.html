<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="03_product_catalog.css">
</head>
<body>
<header class="bg-dark text-white py-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3 mb-0">UrbanCart</h1><span>Smart Shopping</span>
  </div>
</header>
<main class="container py-5">
  <h2 class="text-center fw-bold mb-4">Featured Products</h2>
  <!-- col-md-3 creates four columns on medium+ screens -->
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-3"><article class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Watch"><div class="card-body"><h3 class="h5">Classic Watch</h3><p class="text-muted">₹2,499</p><button class="btn btn-primary w-100">Add to Cart</button></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Running shoes"><div class="card-body"><h3 class="h5">Running Shoes</h3><p class="text-muted">₹3,299</p><button class="btn btn-primary w-100">Add to Cart</button></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Camera"><div class="card-body"><h3 class="h5">Compact Camera</h3><p class="text-muted">₹24,999</p><button class="btn btn-primary w-100">Add to Cart</button></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card h-100 product-card shadow-sm"><img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Laptop"><div class="card-body"><h3 class="h5">Work Laptop</h3><p class="text-muted">₹59,999</p><button class="btn btn-primary w-100">Add to Cart</button></div></article></div>
  </div>
</main>
<footer class="bg-dark text-white text-center py-3">UrbanCart | Assignment by Pushpendra Singh, B.Tech Data Analytics</footer>
</body>
</html>
