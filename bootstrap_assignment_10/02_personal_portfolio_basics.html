<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pushpendra Singh - Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="02_personal_portfolio_basics.css">
</head>
<body class="bg-light text-dark">
<header class="bg-dark text-white text-center p-5">
  <div class="container">
    <h1 class="fw-bold">Pushpendra Singh</h1>
    <p class="lead mb-0">B.Tech Data Analytics | Aspiring Data Analyst</p>
  </div>
</header>
<main class="container text-center py-5">
  <section>
    <img src="https://i.pravatar.cc/300?img=12" class="img-fluid rounded-circle profile-img mb-3" alt="Profile of Pushpendra Singh">
    <h2 class="fw-bold">Hello, I'm Pushpendra Singh</h2>
    <p class="mt-4">I enjoy transforming data into useful insights through SQL, Python, Excel, Power BI, and analytical thinking.</p>
    <div class="mb-4">
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark">Download CV</a>
    </div>
  </section>
  <section id="contact" class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm p-4">
        <h3 class="mb-3">Contact Me</h3>
        <!-- form-control gives Bootstrap styling to inputs -->
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Your Email">
        <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
        <button class="btn btn-dark">Send Message</button>
      </div>
    </div>
  </section>
</main>
<footer class="text-center py-4">
  <small>Pushpendra Singh | B.Tech Data Analytics</small>
</footer>
</body>
</html>
