<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="07_task_tracker_with_badges.css">
</head>
<body class="bg-light">
<header class="bg-primary text-white py-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3 mb-0">Task Tracker</h1>
    <!-- Bootstrap badge shows pending task count -->
    <span class="badge bg-light text-primary fs-6">Pending <span class="badge bg-dark">5</span></span>
  </div>
</header>
<main class="container py-5">
  <section class="card shadow-sm">
    <div class="card-body">
      <h2 class="h4 mb-3">My Tasks</h2>
      <div class="list-group">
        <div class="list-group-item d-flex justify-content-between align-items-center">Finish SQL practice <span class="badge bg-danger rounded-pill">High</span></div>
        <div class="list-group-item d-flex justify-content-between align-items-center">Build Power BI dashboard <span class="badge bg-warning text-dark rounded-pill">Medium</span></div>
        <div class="list-group-item d-flex justify-content-between align-items-center">Read Bootstrap notes <span class="badge bg-success rounded-pill">Low</span></div>
        <div class="list-group-item d-flex justify-content-between align-items-center">Prepare project README <span class="badge bg-danger rounded-pill">High</span></div>
        <div class="list-group-item d-flex justify-content-between align-items-center">Update portfolio <span class="badge bg-warning text-dark rounded-pill">Medium</span></div>
      </div>
      <button class="btn btn-success mt-4">Completed <span class="badge bg-light text-success">2</span></button>
    </div>
  </section>
</main>
<footer class="text-center py-4">Pushpendra Singh | B.Tech Data Analytics</footer>
</body>
</html>
