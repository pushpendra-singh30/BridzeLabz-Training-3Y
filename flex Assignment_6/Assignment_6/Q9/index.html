<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="scene">
        <div class="card">
            <div class="card-face front">
                <img src="https://picsum.photos/500/300" alt="Technology">

            <div class="card-face back">
                <h2>About Technology</h2>
                <p>Technology helps us solve problems, communicate, learn, and create new solutions.</p>
            </div>
        </div>
    </main>
</body>
