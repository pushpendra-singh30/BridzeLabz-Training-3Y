<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Pushpendra Singh | B.Tech Data Analytics</p>
    </header>

    <main class="gallery">
        <!-- Six images with different CSS filters -->
        <figure class="image-card">
            <img class="blur" src="https://picsum.photos/500/350?random=1" alt="Nature image">
            <figcaption>Blur Filter</figcaption>
        </figure>
        <figure class="image-card">
            <img class="grayscale" src="https://picsum.photos/500/350?random=2" alt="City image">
            <figcaption>Grayscale Filter</figcaption>
        </figure>
        <figure class="image-card">
            <img class="sepia" src="https://picsum.photos/500/350?random=3" alt="Mountain image">
            <figcaption>Sepia Filter</figcaption>
        </figure>
        <figure class="image-card">
            <img class="brightness" src="https://picsum.photos/500/350?random=4" alt="Ocean image">
            <figcaption>Brightness Filter</figcaption>
        </figure>
        <figure class="image-card">
            <img class="contrast" src="https://picsum.photos/500/350?random=5" alt="Forest image">
            <figcaption>Contrast Filter</figcaption>
        </figure>
        <figure class="image-card">
            <img class="hue" src="https://picsum.photos/500/350?random=6" alt="Travel image">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Pushpendra Singh - B.Tech Data Analytics</p>
    </footer>
</body>
</html>
