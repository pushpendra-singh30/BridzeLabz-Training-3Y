<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison</h1>
        <p>Pushpendra Singh | B.Tech Data Analytics</p>
    </header>

    <main class="comparison">
        <figure>
            <img src="https://picsum.photos/600/400?random=30" alt="Original image">
            <figcaption>Before - Original Image</figcaption>
        </figure>
        <figure>
            <img class="filtered" src="https://picsum.photos/600/400?random=30" alt="Filtered image">
            <figcaption>After - Contrast Filter</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Pushpendra Singh - B.Tech Data Analytics</p>
    </footer>
</body>
</html>
