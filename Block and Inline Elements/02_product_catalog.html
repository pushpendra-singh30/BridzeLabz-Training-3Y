<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td rowspan="2">Laptop</td>
            <td>High-performance laptop</td>
            <td rowspan="2">₹65,000</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>8 GB RAM, 512 GB SSD</td>
            <td>Limited Stock</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>Wireless optical mouse</td>
            <td>₹800</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Keyboard</td>
            <td>Wireless keyboard</td>
            <td>₹1,500</td>
            <td>Out of Stock</td>
        </tr>
        <tr>
            <td colspan="4">
                <strong>Product Images:</strong>
                <img src="https://via.placeholder.com/100?text=Laptop" alt="Laptop image">
                <img src="https://via.placeholder.com/100?text=Mouse" alt="Mouse image">
                <img src="https://via.placeholder.com/100?text=Keyboard" alt="Keyboard image">
            </td>
        </tr>
    </table>
</body>
</html>
