<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <h1>Travel Selection Page</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Nepal</option>
        <option>Japan</option>
    </select>
    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Himachal Pradesh</option>
    </select>
    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Jaipur</option>
        <option>Manali</option>
    </select>
    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Vrindavan</option>
        <option>Agra</option>
        <option>Jaipur</option>
    </select>

    <p>My choices are: India, Uttar Pradesh, Mathura, and Vrindavan.</p>
</body>
</html>
