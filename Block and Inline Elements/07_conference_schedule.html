<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <!-- Conference schedule table -->
    <table border="1">
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>
        <tbody>
            <tr><td rowspan="2">Morning</td><td>9:00 AM</td><td>Opening Keynote</td><td>Dr. Sharma</td></tr>
            <tr><td>10:30 AM</td><td>Artificial Intelligence</td><td>Ms. Priya</td></tr>
            <tr><td rowspan="2">Afternoon</td><td>1:00 PM</td><td>Cloud Computing</td><td>Mr. Raj</td></tr>
            <tr><td>3:00 PM</td><td>Cyber Security</td><td>Ms. Anita</td></tr>
            <tr><td>Evening</td><td>6:00 PM</td><td>Closing Session</td><td>Conference Team</td></tr>
        </tbody>
        <tfoot>
            <tr><td colspan="4">End of Conference Schedule</td></tr>
        </tfoot>
    </table>
</body>
</html>
