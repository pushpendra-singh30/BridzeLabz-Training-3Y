<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>

    <style>

        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ddd;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        h2 {
            color: #555;
            font-size: 20px;
        }

        h3 {
            color: #777;
            font-weight: normal;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .skills {
            color: #4a90e2;
            font-weight: bold;
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="profile">
            👤
        </div>

        <h1>Pushpendra Singh</h1>

        <h2>Computer Science Engineering</h2>

        <h3>GLA University</h3>

        <p>
            I am a passionate Computer Science student interested in
            Web Development, Java, and problem solving.
        </p>

        <h2>Skills</h2>

        <p class="skills">
            HTML &nbsp;&nbsp;
            CSS &nbsp;&nbsp;
            Java &nbsp;&nbsp;
            Problem Solving
        </p>

        <br>

        <button>Contact Me</button>

    </div>

</body>

</html>
