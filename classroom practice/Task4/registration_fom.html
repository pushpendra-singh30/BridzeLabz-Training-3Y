<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

    <h2><u><center>Registration Form</center></u></h2>

    <center><form action="registration_form2.html">
        <table border="1" width = 70% height = 400>

            <tr>
                <td><label>Name:</label></td>
                <td><input type="text" name="name" placeholder = "Enter Your Name"></td>
            </tr>

            <tr>
                <td><label>Email:</label></td>
                <td><input type="email" name="email" placeholder = "Enter Your Email"></td>
            </tr>

            <tr>
                <td><label>Password:</label></td>
                <td><input type="password" name="password" placeholder = "Enter Your Password"></td>
            </tr>

            <tr>
                <td><label>Phone:</label></td>
                <td><input type="tel" name="phone" placeholder = "Enter Your Number"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>

            <tr>
                <td><label>Date of Birth:</label></td>
                <td><input type="date" name="dob"></td>
            </tr>

            <tr>
                <td><label>City:</label></td>
                <td>
                    <select name="city">
                        <option>Select City</option>
                        <option>Delhi</option>
                        <option>Mumbai</option>
                        <option>Mathura</option>
                        <option>Agra</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" name="hobby"> Reading
                    <input type="checkbox" name="hobby"> Music
                    <input type="checkbox" name="hobby"> Sports
                </td>
            </tr>

            <tr>
                <td colspan="2"><center>
                    <input type="submit" value="Register">
			&nbsp;&nbsp;&nbsp;
                    <input type="reset" value="Reset">
                </center></td>
            </tr>

        </table>
    </form></center>

</body>
</html>
