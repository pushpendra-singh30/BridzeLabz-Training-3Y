<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="06_photo_gallery.css">
</head>
<body>
    <main>
        <h1>My Photo Gallery</h1>

        <!-- CSS Grid automatically changes the number of columns -->
        <section class="gallery">
            <figure><img src="https://picsum.photos/id/1015/600/400" alt="Mountain"><figcaption>Mountain</figcaption></figure>
            <figure><img src="https://picsum.photos/id/1016/600/400" alt="Forest"><figcaption>Forest</figcaption></figure>
            <figure><img src="https://picsum.photos/id/1018/600/400" alt="Nature"><figcaption>Nature</figcaption></figure>
            <figure><img src="https://picsum.photos/id/1025/600/400" alt="Animal"><figcaption>Animal</figcaption></figure>
            <figure><img src="https://picsum.photos/id/1035/600/400" alt="Beach"><figcaption>Beach</figcaption></figure>
            <figure><img src="https://picsum.photos/id/1043/600/400" alt="Road"><figcaption>Road</figcaption></figure>
        </section>
    </main>
</body>
</html>
