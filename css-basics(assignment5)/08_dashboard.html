<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="08_dashboard.css">
</head>
<body>
    <!-- Fixed dashboard header -->
    <header class="dashboard-header">
        <h1>Admin Dashboard</h1>
    </header>

    <div class="dashboard">
        <!-- Sidebar navigation -->
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main dashboard content -->
        <main class="content">
            <section class="box">
                <h2>Sales Overview</h2>
                <p>Monthly sales have increased by 18%.</p>
            </section>

            <section class="box">
                <h2>Recent Activity</h2>
                <p>24 new users joined this month.</p>
            </section>
        </main>
    </div>
</body>
</html>
